<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL STUDIO</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #10111a;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 70px;
    padding: 0 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #191b29;
    border-bottom: 1px solid #303247;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #8b70ff;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

button, select {
    border: none;
    border-radius: 9px;
    padding: 10px 15px;
    background: #292c40;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

button:hover {
    background: #414563;
}

.primary {
    background: #795cff;
}

.primary:hover {
    background: #6749ed;
}

.layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 70px);
}

.sidebar {
    background: #191b29;
    border-right: 1px solid #303247;
    padding: 22px 16px;
}

.section {
    margin-bottom: 25px;
}

.section h3 {
    font-size: 12px;
    color: #9295ae;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 13px;
}

.tool-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.tool {
    padding: 13px 5px;
    background: #25283a;
    border: 1px solid transparent;
}

.tool.active {
    background: #352c60;
    border-color: #927cff;
    color: #c6baff;
}

.tool .icon {
    display: block;
    font-size: 22px;
    margin-bottom: 6px;
}

.tool span:last-child {
    font-size: 12px;
}

input[type="color"] {
    width: 100%;
    height: 45px;
    border: none;
    background: transparent;
    cursor: pointer;
}

input[type="range"] {
    width: 100%;
    accent-color: #8b70ff;
    cursor: pointer;
}

.size-value {
    color: #aaa;
    font-size: 12px;
    margin-top: 8px;
}

.background-options {
    display: flex;
    gap: 8px;
}

.bg-option {
    flex: 1;
    padding: 10px 3px;
    font-size: 12px;
}

.bg-option.active {
    background: #493a83;
    outline: 1px solid #927cff;
}

.workspace {
    padding: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
}

.workspace-top {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 10px;
}

.workspace-top h2 {
    font-size: 17px;
}

.workspace-top p {
    font-size: 12px;
    color: #9295ae;
    margin-top: 5px;
}

.canvas-wrapper {
    width: 100%;
    max-width: 1050px;
    background: #25283a;
    padding: 12px;
    border-radius: 13px;
    border: 1px solid #383b52;
    box-shadow: 0 15px 50px #0005;
}

canvas {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    background: white;
    border-radius: 5px;
    cursor: crosshair;
    touch-action: none;
}

.hint {
    margin-top: 15px;
    color: #8589a3;
    font-size: 12px;
    text-align: center;
}

footer {
    text-align: center;
    padding: 18px;
    color: #777b94;
    font-size: 12px;
}

@media(max-width: 700px) {
    header {
        padding: 0 13px;
        height: 62px;
    }

    .logo {
        font-size: 18px;
    }

    .header-buttons button {
        padding: 9px;
        font-size: 12px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: none;
        border-bottom: 1px solid #303247;
        padding: 14px;
    }

    .section {
        margin-bottom: 15px;
    }

    .tool-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .tool {
        padding: 9px 3px;
    }

    .tool .icon {
        font-size: 19px;
    }

    .workspace {
        padding: 15px 10px;
    }

    .canvas-wrapper {
        padding: 6px;
    }

    .workspace-top h2 {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">PIXEL <span>STUDIO</span></div>

    <div class="header-buttons">
        <button onclick="undo()">↶ Undo</button>
        <button onclick="redo()">↷ Redo</button>
        <button class="primary" onclick="downloadImage()">⬇ Save PNG</button>
    </div>
</header>

<div class="layout">

<aside class="sidebar">

    <div class="section">
        <h3>Drawing Tools</h3>

        <div class="tool-grid">
            <button class="tool active" id="pencilBtn" onclick="setTool('pencil')">
                <span class="icon">✏️</span>
                <span>Pencil</span>
            </button>

            <button class="tool" id="eraserBtn" onclick="setTool('eraser')">
                <span class="icon">🧽</span>
                <span>Eraser</span>
            </button>
        </div>
    </div>

    <div class="section">
        <h3>Colour</h3>
        <input type="color" id="colorPicker" value="#222222">
    </div>

    <div class="section">
        <h3>Brush Size</h3>
        <input type="range" id="brushSize" min="1" max="80" value="8">
        <div class="size-value">
            Size: <span id="sizeValue">8</span> px
        </div>
    </div>

    <div class="section">
        <h3>Canvas Background</h3>

        <div class="background-options">
            <button class="bg-option active" id="whiteBtn" onclick="setBackground('white')">White</button>
            <button class="bg-option" id="blackBtn" onclick="setBackground('black')">Black</button>
            <button class="bg-option" id="transparentBtn" onclick="setBackground('transparent')">Clear</button>
        </div>
    </div>

    <div class="section">
        <h3>Canvas Actions</h3>
        <button style="width:100%" onclick="clearCanvas()">🗑 Clear Canvas</button>
    </div>

</aside>

<main class="workspace">

    <div class="workspace-top">
        <div>
            <h2>My Canvas</h2>
            <p>Let your creativity flow.</p>
        </div>
        <button onclick="downloadImage()">⬆️ Export</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="1200" height="800"></canvas>
    </div>

    <div class="hint">
        Draw using your mouse, Apple Pencil or finger.
    </div>

</main>

</div>

<footer>
    PIXEL STUDIO © 2026 · CREATE SOMETHING AMAZING
</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const colorPicker = document.getElementById("colorPicker");
const brushSize = document.getElementById("brushSize");
const sizeValue = document.getElementById("sizeValue");

let tool = "pencil";
let background = "white";
let drawing = false;
let lastX = 0;
let lastY = 0;

let history = [];
let historyIndex = -1;
const maxHistory = 30;

// Background handling

function paintBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (background === "white") {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (background === "black") {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

// Save canvas state

function saveState() {
    history = history.slice(0, historyIndex + 1);

    history.push({
        image: ctx.getImageData(0, 0, canvas.width, canvas.height),
        background: background
    });

    if (history.length > maxHistory) {
        history.shift();
    }

    historyIndex = history.length - 1;
}

function restoreState(index) {
    if (index < 0 || index >= history.length) return;

    historyIndex = index;

    const state = history[index];
    background = state.background;

    ctx.putImageData(state.image, 0, 0);
    updateBackgroundButtons();
}

function undo() {
    if (historyIndex > 0) {
        restoreState(historyIndex - 1);
    }
}

function redo() {
    if (historyIndex < history.length - 1) {
        restoreState(historyIndex + 1);
    }
}

// Tools

function setTool(selectedTool) {
    tool = selectedTool;

    document.getElementById("pencilBtn").classList.toggle(
        "active", tool === "pencil"
    );

    document.getElementById("eraserBtn").classList.toggle(
        "active", tool === "eraser"
    );

    canvas.style.cursor = tool === "eraser" ? "cell" : "crosshair";
}

// Background selection

function updateBackgroundButtons() {
    document.getElementById("whiteBtn").classList.toggle(
        "active", background === "white"
    );

    document.getElementById("blackBtn").classList.toggle(
        "active", background === "black"
    );

    document.getElementById("transparentBtn").classList.toggle(
        "active", background === "transparent"
    );
}

function setBackground(type) {
    background = type;

    paintBackground();
    updateBackgroundButtons();
    saveState();
}

// Brush size

brushSize.addEventListener("input", () => {
    sizeValue.textContent = brushSize.value;
});

// Drawing coordinates

function getPosition(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
    };
}

// Start drawing

canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();

    drawing = true;
    canvas.setPointerCapture(event.pointerId);

    const pos = getPosition(event);

    lastX = pos.x;
    lastY = pos.y;

    ctx.beginPath();
    ctx.arc(
        lastX,
        lastY,
        Number(brushSize.value) / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = tool === "eraser"
        ? (background === "transparent" ? "rgba(0,0,0,1)" : background === "white" ? "#ffffff" : "#000000")
        : colorPicker.value;

    if (tool === "eraser") {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.fill();
        ctx.restore();
    } else {
        ctx.fill();
    }
});

// Draw

canvas.addEventListener("pointermove", (event) => {
    if (!drawing) return;

    event.preventDefault();

    const pos = getPosition(event);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);

    ctx.lineWidth = Number(brushSize.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (tool === "eraser") {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.stroke();
        ctx.restore();
    } else {
        ctx.strokeStyle = colorPicker.value;
        ctx.stroke();
    }

    lastX = pos.x;
    lastY = pos.y;
});

// Stop drawing

function stopDrawing() {
    if (!drawing) return;

    drawing = false;
    saveState();
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("lostpointercapture", stopDrawing);

// Clear canvas

function clearCanvas() {
    if (!confirm("Are you sure you want to clear your canvas?")) {
        return;
    }

    paintBackground();
    saveState();
}

// Download PNG

function downloadImage() {
    const link = document.createElement("a");

    link.download = "pixel-studio-artwork.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
}

// Keyboard shortcuts

document.addEventListener("keydown", (event) => {
    if (event.ctrlKey && event.key.toLowerCase() === "z") {
        event.preventDefault();
        undo();
    }

    if (event.ctrlKey && event.key.toLowerCase() === "y") {
        event.preventDefault();
        redo();
    }
});

// Initialize

paintBackground();
saveState();

</script>

</body>
</html>
